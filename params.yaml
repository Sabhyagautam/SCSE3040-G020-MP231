paths:
  train_raw: data/raw/train.csv
  later_raw: data/raw/later.csv
  holdout_raw: data/raw/holdout_features.csv
  model_output: models/model.joblib
  predictions_output: predictions/holdout_predictions.csv

preprocessing:
  sentinel_value: 9999.0
  sentinel_column: distance_to_market_km
  target_column: withdrawal_thousand_rs
  target_typo_threshold: 1200.0
  id_column: record_id
  date_column: date
  leaking_columns:
    - cash_reloaded_next_day
  categorical_columns:
    - atm_type
    - area
  numeric_columns:
    - nearby_shops
    - days_to_salary
    - footfall_index
    - distance_to_market_km
    - avg_ticket_rs
    - other_atms_1km
  feature_columns:
    - nearby_shops
    - days_to_salary
    - footfall_index
    - distance_to_market_km
    - avg_ticket_rs
    - other_atms_1km
    - atm_type
    - area

model:
  name: GradientBoostingRegressor
  n_estimators: 200
  max_depth: 4
  learning_rate: 0.1
  random_state: 42

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: atm_cash_demand
  registered_model_name: atm_demand_model

monitoring:
  psi_bins: 10
  later_split_ratio: 0.70
  promotion_threshold: 0.15
